; SurfCam Rover – PlatformIO-Konfiguration
;
;   pio run -e trackerd -t upload     Firmware bauen und flashen
;   pio device monitor                serieller Monitor (115200)
;   pio test -e native                Unit-Tests (NMEA-Parser, Paketformat) auf dem PC
;
; Der Sketch-Ordner ist gleichzeitig src_dir, damit er auch mit der Arduino IDE gebaut werden kann.

[platformio]
src_dir = .
default_envs = trackerd

[env:trackerd]
platform = espressif32@6.9.0          ; Arduino-ESP32 Core 2.0.x; der Code ist auch mit Core 3.x kompatibel
board = pico32
framework = arduino
board_build.flash_mode = dio          ; IO9/IO10 (GNSS-UART) sind nur im DIO-Modus frei
board_build.partitions = default.csv  ; enthält die "spiffs"-Partition für LittleFS (~1.4 MB)
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    sandeepmistry/LoRa@0.8.0
build_src_filter = +<*.cpp> +<*.ino>   ; nur Dateien im Sketch-Ordner, nicht test/
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<nmea.cpp> +<packet.cpp>
build_flags = -std=c++17 -Wall -Wextra -I${PROJECT_DIR}
